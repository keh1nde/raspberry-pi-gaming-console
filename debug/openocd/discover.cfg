# discover.cfg — reads the BCM2712 CoreSight ROM table so we can fill in
# the debug base addresses in bcm2712.cfg.
#
# Usage (probe connected to Pi 5 via SWD, Pi 5 powered and running):
#   openocd -f debug/openocd/discover.cfg
# Then in a second terminal:
#   telnet localhost 4444
#   > dap info 0
#
# The output lists every CoreSight component and its base address.
# Copy the DBG (debug) and CTI addresses for each core into bcm2712.cfg.

source [find interface/cmsis-dap.cfg]
transport select swd
adapter speed 4000

set _CHIPNAME bcm2712

swd newdap $_CHIPNAME cpu -expected-id 0x4ba00477

dap create $_CHIPNAME.dap -chain-position $_CHIPNAME.cpu

# MEM-AP 0: the system bus access port used to read the ROM table.
target create $_CHIPNAME.ap mem_ap -dap $_CHIPNAME.dap -ap-num 0

init

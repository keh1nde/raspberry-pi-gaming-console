# pi5.cfg — OpenOCD session config for Raspberry Pi 5 + Debug Probe.
#
# Usage (probe connected to Pi 5 via SWD, pi5 powered and halted or running):
#   openocd -f debug/openocd/pi5.cfg
# Then in a second terminal:
#   telnet localhost 4444          # OpenOCD TCL console
#   aarch64-elf-gdb kernel8.elf -ex "target extended-remote :3333"
#
# Prerequisites on the Pi 5 SD card (config.txt or firmware/config.txt):
#   enable_jtag_gpio=1
# This muxes the SWD signals onto the GPIO header pins.
#
# Physical wiring (Debug Probe D port → Pi 5 3-pin debug connector):
#   Use the JST-SH cable that came with the probe.
#   Connect the probe's D (debug/SWD) port — NOT the UART port — to the
#   Pi 5's 3-pin debug connector (between the two HDMI ports).
#   enable_jtag_gpio=1 in config.txt muxes that connector from UART to SWD.

source [find interface/cmsis-dap.cfg]
transport select swd

source debug/openocd/bcm2712.cfg
